# N64Recomp's configuration for Turok 3: Shadow of Oblivion (USA), SHA-1 a2e0a28dc0d3a48c7c02cb9e4c4b38fe04b2d436: it
# reads the game's code out of the ROM by the symbols in syms/ (lib/turok-engine/tools/gen_syms.py and
# syms/layout.toml, from the ROM alone) and writes RecompiledFuncs/ (tools/recompile.sh). The code runs through the TLB
# (lib/turok-engine/docs/rom_layout.md), so the symbols' sections, and every address here, are the ones the code uses.
[input]
# The entry point the code is linked at: the header's 0x80000400, seen through TLB entry 31, which the entry point
# itself sets up. The runtime starts there; the TLB writes are taken out below and the engine maps the views instead
# (lib/turok-engine/src/tlb_views.cpp).
entrypoint = 0x00200400
# Paths are relative to this file.
symbols_file_path = "syms/turok3.us.syms.toml"
rom_file_path = "roms/turok3.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Never run under the recompiler: they install, or are, the game's own exception layer and TLB-miss pager, or set up
# the TLB and the watch registers, which the engine's TLB views replace (lib/turok-engine/src/tlb_views.cpp). Stubbed
# (empty bodies) where something still calls them.
stubs = [
    "t3_SetTLBEntry",
    "t3_MapTLB",
    "t3_DumpTLB",
    "t3_ReadTLBEntry",
    "t3_SetWatchLo_main",
    "t3_SetWatchLo_ovl",
    "t3_MapMainTLB",
    "t3_InstallExceptionVectors",
    "t3_CacheFlush0",
    "t3_CacheFlush1",
    # libultra's ROM handle init with no callers; it uses osPiRawReadIo, which the runtime doesn't have.
    "t3_PiRomHandleInit",
]
# Natives in their place.
ignored = [
    # The game's DMA thread calls osPiRawStartDma itself (lib/turok-engine/src/pi_dma.cpp).
    "turok_pi_raw_start_dma",
    # Maps ROM data into TLB space, which the game's pager fills on a TLB miss (lib/turok-engine/src/tlb_views.cpp).
    "turok_vm_map_rom_region",
    # osAiGetStatus, the audio thread's pace (lib/turok-engine/src/audio.cpp).
    "turok_ai_get_status",
    # osMotorInit, which answers as each port's accessory would (lib/turok-engine/src/controller_pak.cpp).
    "turok_motor_init",
    "t3_ExceptionVectors",
    "t3_Exception",
    "t3_ExceptionTail0",
]

# The entry point's cop0 and TLB instructions and its call to the TLB writer, and the `break` after its jalr to the
# boot code: on a console that call never returns (the first osStartThread switches away for good), but the runtime's
# osStartThread returns to the entry thread, which then ends. Every game of the engine has this entry point
# (PaxDino's turokrw.us.toml).
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020040C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200410
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200418
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020041C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200420
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200428
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020043C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x0020046C
value = 0x00000000
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x00200484
value = 0x00000000

# The game's DMA thread waits for the PI interrupt it registers in t3_DmaInit (osSetEventMesg(OS_EVENT_PI, mq, 0x7D1)).
# The runtime doesn't track OS_EVENT_PI, so the engine records it to post each DMA's completion
# (lib/turok-engine/src/pi_dma.cpp).
[[patches.hook]]
func = "t3_DmaInit"
before_vram = 0x0024346C
text = "    { void turok_set_pi_event(uint8_t*, uint64_t, uint32_t); turok_set_pi_event(rdram, ctx->r5, 0x7D1); }"

# libultra's osCreateViManager sets a default VI mode (__osViInit, NTSC LPN1), and the game relies on it: it waits for
# retraces before it ever calls osViSetMode. The runtime's osCreateViManager sets none, and its VI thread sends no
# retrace messages until a mode is set, so the same default (the game's own osViModeNtscLpn1, 0x8010BEC0) is set right
# after the call.
[[patches.hook]]
func = "func_002844A8"
before_vram = 0x002844CC
text = "    { void osViSetMode(uint8_t*, int32_t); osViSetMode(rdram, (int32_t)0x8010BEC0); }"

# t3_boot_main copies the 512 KB of the program after the first MB (ROM 0x101000 on) to 0x80100400 itself, with lw from
# the cartridge bus (0xB0101000) in a loop, which the runtime has no mapping for. The engine's game copies it there
# before the game runs (register_overlays.cpp), so the loop is jumped over: lui $a2, 0xB010 -> b 0x0020AB50.
[[patches.instruction]]
func = "t3_boot_main"
vram = 0x0020AAFC
value = 0x10000014

# osClockRate (0x80171B40): libultra's osInitialize sets it, but the runtime's, which runs in its place, doesn't
# (lib/turok-engine/src/pi_dma.cpp). Set right after the game's call.
[[patches.hook]]
func = "t3_boot_main"
before_vram = 0x0020ABE0
text = "    { void turok_set_clock_rate(uint8_t*, uint32_t); turok_set_clock_rate(rdram, 0x80171B40); }"

# Widescreen (lib/turok-engine/src/widescreen.cpp), at the places Turok 2 has them. The game's frame (func_00285424)
# swaps to its next display list buffer in func_00284868 (Turok 2's func_00286A04) and ends the list with G_FULLSYNC
# and G_ENDDL from 0x002855E0, before it hands the task on; its HUD (the health counter and what goes with it, as
# rectangles) is func_0028D318's, Turok 2's func_0027C1E8 with the player's fields moved.
[[patches.hook]]
func = "func_00285424"
before_vram = 0x0028547C
text = "    { void turok_frame_begin(uint8_t*); turok_frame_begin(rdram); }"

[[patches.hook]]
func = "func_00285424"
before_vram = 0x002855E0
text = "    { void turok_frame_end(uint8_t*); turok_frame_end(rdram); }"

[[patches.hook]]
func = "func_0028D318"
before_vram = 0x0028D318
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_0028D318"
before_vram = 0x0028D5DC
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

# The messages, drawn in the middle of the HUD (func_002CB7FC, from func_0028D318 by way of func_002D523C) and left out
# of it: lines of letters centred on the screen, which the HUD's automatic anchoring would take apart by where each
# letter sits. The Breach's "New Objective / Get to the breach and stop Oblivion", in the screen's top quarter, had its
# left letters at the window's left and its right ones at the right. func_00214C3C draws the message the player's
# +0xEBC times, func_00214FC0 the one +0xEC8 holds; each is closed out of the HUD from its start to its one jr $ra, so
# it's drawn as at 4:3, centred in the window.
[[patches.hook]]
func = "func_00214C3C"
before_vram = 0x00214C3C
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

[[patches.hook]]
func = "func_00214C3C"
before_vram = 0x00214FB8
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

[[patches.hook]]
func = "func_00214FC0"
before_vram = 0x00214FC0
text = "    { void turok_hud_end(uint8_t*); turok_hud_end(rdram); }"

[[patches.hook]]
func = "func_00214FC0"
before_vram = 0x002151F4
text = "    { void turok_hud_begin(uint8_t*); turok_hud_begin(rdram); }"

# The camera (func_0028EA30, Turok 2's func_0027D160) has made its float view-projection matrix (+0x1E0 of its struct,
# s4) and the display list's copy of it (func_0025FE24, guMtxF2L): widened from here for the culling, which reads the
# float one.
[[patches.hook]]
func = "func_0028EA30"
before_vram = 0x0028F104
text = "    { void turok_widen_culling(uint8_t*, uint32_t); turok_widen_culling(rdram, (uint32_t)ctx->r20 + 0x1E0); }"

# The level's own culling (lib/turok-engine's docs/widescreen.md, 'The culling'). The camera's func_0028E8B8 (Turok 2's
# is inline in its camera) has made its view pyramid at its stack's 0x18, the eye and four 4:3 far corners, and moves
# it into the world here (func_002628E8, 5 points), taking the side planes and box the level's rooms are chosen
# against from it: widened first.
[[patches.hook]]
func = "func_0028E8B8"
before_vram = 0x0028E960
text = "    { void turok_widen_frustum(uint8_t*, uint32_t, uint32_t); turok_widen_frustum(rdram, (uint32_t)ctx->r29 + 0x18, 5); }"

# The menus' swirling backdrop (src/game/widescreen.cpp). The menu code (func_00414FD0: the boot screens, the title and
# the menus) has built the swirl's float matrix at $a0, and converts it here for the display list (func_00260404,
# guMtxF2L, into 0x80125630 and on), so a window wider than 16:9 widens it first.
[[patches.hook]]
func = "func_00414FD0"
before_vram = 0x00415634
text = "    { void t3_widen_menu_backdrop(uint8_t*, uint32_t); t3_widen_menu_backdrop(rdram, (uint32_t)ctx->r4); }"

# The menus go the way the keys and sticks are pushed. The game looks down with its stick pushed up, as a plane's stick,
# so src/game/config.cpp binds the up arrow and the right stick pushed up to the stick pushed down, and src/main/main.cpp
# adds the mouse the same way: up looks up. The menus read the same stick, through the four direction bits each pad's
# reading (func_00251960) makes of it past 30 either way (0x10000 up, 0x80000 down, OR'd into its buttons), so up moved
# their cursor down. Here the stick pushed down sets the up bit and pushed up the down bit; the stick's value the game
# looks with, which the same function keeps apart from them, is left as it was.
[[patches.instruction]]
func = "func_00251960"
vram = 0x002519AC
value = 0x3C020001
[[patches.instruction]]
func = "func_00251960"
vram = 0x002519BC
value = 0x3C020008

# Mouse look (lib/turok-engine/src/mouse_look.cpp): the mouse turns the view itself instead of being added to the stick.
# The player's look on foot (func_002CF978, Turok 2's func_0024EF70: its struct in s0, its object in s2, the limits of
# its pitch at +0x10 and +0x14 of the table in s1) has just turned the yaw (the object's +0x6C, radians, growing to the
# right) and is about to move the pitch (+0xDD0, radians, growing upwards) towards a target it makes of the stick, in a1,
# so that the look springs back level when the stick is let go: the engine adds the mouse's movement to both and holds
# the target.
[[patches.hook]]
func = "func_002CF978"
before_vram = 0x002CFBF4
text = "    { void turok_mouse_look(uint8_t*, uint32_t, float, uint32_t, float, gpr*, float, float); union { int32_t i; float f; } lo = { MEM_W(0x10, ctx->r17) }, hi = { MEM_W(0x14, ctx->r17) }; turok_mouse_look(rdram, (uint32_t)ctx->r18 + 0x6C, 1.0f, (uint32_t)ctx->r16 + 0xDD0, 1.0f, &ctx->r5, lo.f, hi.f); }"
